<header class="hdr">
  <div class="container hdr-inner">
    <button
      class="icon-btn menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span class="bars" [class.open]="menuOpen()"><span></span><span></span><span></span></span>
    </button>

    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="EZONE home">
      {{ brand }}
    </a>

    <nav class="nav" aria-label="Primary">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        >{{ link.label }}</a>
      }
    </nav>

    <div class="actions">
      <button class="icon-btn" type="button" aria-label="Search products" (click)="toggleSearch()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
      </button>

      <button
        class="icon-btn account-btn"
        type="button"
        [attr.aria-label]="identity.hasValidIdentity() ? 'Your details' : 'Account'"
        (click)="openAccount()"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" /><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" />
        </svg>
        @if (identity.hasValidIdentity()) { <span class="dot" aria-hidden="true"></span> }
      </button>

      <a class="icon-btn cart-link" routerLink="/cart" aria-label="View cart">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 6h15l-1.5 9h-12z" /><circle cx="9" cy="20" r="1.4" /><circle cx="18" cy="20" r="1.4" /><path d="M6 6 5 3H2" />
        </svg>
        @if (cart.count() > 0) {
          <span class="cart-count" aria-hidden="true">{{ cart.count() }}</span>
        }
        <span class="sr-only">Cart, {{ cart.count() }} items</span>
      </a>
    </div>
  </div>

  @if (searchOpen()) {
    <div class="search-bar">
      <form class="container search-form" (ngSubmit)="submitSearch()" role="search">
        <input
          class="input"
          type="search"
          name="q"
          [(ngModel)]="query"
          placeholder="Search iPhones, tablets, accessories…"
          aria-label="Search products"
          autofocus
        />
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
    </div>
  }

  @if (menuOpen()) {
    <nav class="mobile-nav" aria-label="Mobile">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
    </nav>
  }
</header>
