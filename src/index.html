<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // amazon-cognito-identity-js and its bundled deps (buffer, sha256-js)
      // reference Node's `global`, which does not exist in browsers. Define it
      // before any app module loads so the admin auth code runs. Must stay in
      // <head> and run before the bundled scripts.
      window.global = window;
    </script>
    <title>EZONE | Electronics Store Singapore</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="EZONE — buy genuine iPhones, EZONE tablets and accessories in Singapore. Clean prices, fast local delivery, and secure PayNow & card checkout."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://ezone.sg/" />

    <meta property="og:site_name" content="EZONE" />
    <meta property="og:title" content="EZONE | Electronics Store Singapore" />
    <meta property="og:description" content="Genuine iPhones, EZONE tablets and accessories in Singapore. Fast delivery and secure checkout." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ezone.sg/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="assets/images/ezone-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

        "areaServed": "Singapore",
        "currenciesAccepted": "SGD"
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
